version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: estadodigital_web
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://postgres:postgres_password@db:5432/postgres_db
    depends_on:
      - db
    restart: always

  db:
    image: postgres:15-alpine
    container_name: estadodigital_db
    environment:
      - POSTGRES_DB=postgres_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: always

volumes:
  postgres_data:
